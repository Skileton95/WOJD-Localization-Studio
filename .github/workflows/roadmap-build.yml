name: Roadmap branch build

on:
  push:
    branches:
      - roadmap-v0.2.15
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore WOJD.LocalizationStudio.sln

      - name: Build
        run: dotnet build WOJD.LocalizationStudio.sln -c Release --no-restore
