name: Build Windows release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read version
        shell: pwsh
        run: |
          [xml]$project = Get-Content 'src/WOJD.LocalizationStudio/WOJD.LocalizationStudio.csproj'
          $version = $project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Version is missing from csproj.' }
          [xml]$updater = Get-Content 'src/WOJD.LocalizationStudio.Updater/WOJD.LocalizationStudio.Updater.csproj'
          if ($updater.Project.PropertyGroup.Version -ne $version) { throw 'Application/updater versions must match.' }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Regression checks
        shell: pwsh
        run: dotnet run --project tests/WOJD.LocalizationStudio.Tests -c Release

      - name: Large file check (100k rows)
        shell: pwsh
        run: dotnet run --project tests/WOJD.LocalizationStudio.Tests -c Release -- --perf 100000

      - name: SQLite file check (100k rows)
        shell: pwsh
        run: dotnet run --project tests/WOJD.LocalizationStudio.Tests -c Release -- --perf-index 100000

      - name: Publish application
        shell: pwsh
        run: |
          dotnet publish 'src/WOJD.LocalizationStudio/WOJD.LocalizationStudio.csproj' `
            -c Release -r win-x64 --self-contained true `
            -o 'publish/app'

      - name: Published app self-check
        shell: pwsh
        run: |
          $env:WOJD_WORKSPACE_DIRECTORY = Join-Path $env:RUNNER_TEMP 'wojd-published-self-check'
          $app = Start-Process -FilePath (Resolve-Path 'publish/app/WOJD-Localization-Studio.exe') -ArgumentList '--self-check' -WindowStyle Hidden -Wait -PassThru
          if ($app.ExitCode -ne 0) {
            Get-Content (Join-Path $env:WOJD_WORKSPACE_DIRECTORY 'self-check-error.log') -ErrorAction SilentlyContinue
            throw "Published application self-check failed: $($app.ExitCode)"
          }
          $report = Get-Content (Join-Path $env:WOJD_WORKSPACE_DIRECTORY 'self-check.json') | ConvertFrom-Json
          if (!$report.Success -or $report.Version -ne $env:VERSION) { throw 'Published version/self-check mismatch.' }

      - name: Publish updater
        shell: pwsh
        run: |
          dotnet publish 'src/WOJD.LocalizationStudio.Updater/WOJD.LocalizationStudio.Updater.csproj' `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -o 'publish/updater'
          New-Item -ItemType Directory -Force -Path 'publish/app/Updater' | Out-Null
          Copy-Item 'publish/updater/WOJD-Localization-Studio.Updater.exe' 'publish/app/Updater/WOJD-Localization-Studio.Updater.exe' -Force
          Set-Content -Path 'publish/app/version.txt' -Value $env:VERSION -NoNewline

      - name: Pack release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'dist' | Out-Null
          Compress-Archive -Path 'publish/app/*' -DestinationPath 'dist/WOJD-Localization-Studio-win-x64.zip' -Force
          $hash = (Get-FileHash 'dist/WOJD-Localization-Studio-win-x64.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path 'dist/WOJD-Localization-Studio-win-x64.zip.sha256' -Value "$hash  WOJD-Localization-Studio-win-x64.zip"

          $manifest = [ordered]@{
            version = $env:VERSION
            packageUrl = "https://github.com/Skileton95/WOJD-Localization-Studio/releases/download/v$env:VERSION/WOJD-Localization-Studio-win-x64.zip"
            sha256 = $hash
          } | ConvertTo-Json -Compress
          Set-Content -Path 'dist/update.json' -Value $manifest -NoNewline

      - name: Create or update release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag `
              'dist/WOJD-Localization-Studio-win-x64.zip' `
              'dist/WOJD-Localization-Studio-win-x64.zip.sha256' `
              'dist/update.json' `
              --clobber
          }
          else {
            gh release create $tag `
              'dist/WOJD-Localization-Studio-win-x64.zip' `
              'dist/WOJD-Localization-Studio-win-x64.zip.sha256' `
              'dist/update.json' `
              --title "WOJD Localization Studio $env:VERSION" `
              --generate-notes `
              --latest
          }

      # Retain earlier releases for recovery and reproducible validation.
