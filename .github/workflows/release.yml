name: Build Windows release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read version
        shell: pwsh
        run: |
          [xml]$project = Get-Content 'src/WOJD.LocalizationStudio/WOJD.LocalizationStudio.csproj'
          $version = $project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Version is missing from csproj.' }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish application
        shell: pwsh
        run: |
          dotnet publish 'src/WOJD.LocalizationStudio/WOJD.LocalizationStudio.csproj' `
            -c Release -r win-x64 --self-contained true `
            -o 'publish/app'

      - name: Publish updater
        shell: pwsh
        run: |
          dotnet publish 'src/WOJD.LocalizationStudio.Updater/WOJD.LocalizationStudio.Updater.csproj' `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -o 'publish/updater'
          New-Item -ItemType Directory -Force -Path 'publish/app/Updater' | Out-Null
          Copy-Item 'publish/updater/WOJD-Localization-Studio.Updater.exe' 'publish/app/Updater/WOJD-Localization-Studio.Updater.exe' -Force
          Set-Content -Path 'publish/app/version.txt' -Value $env:VERSION -NoNewline

      - name: Updater end-to-end smoke test
        shell: pwsh
        run: |
          ./tests/updater-smoke.ps1 -UpdaterExe 'publish/updater/WOJD-Localization-Studio.Updater.exe'

      - name: Pack release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'dist' | Out-Null
          Compress-Archive -Path 'publish/app/*' -DestinationPath 'dist/WOJD-Localization-Studio-win-x64.zip' -Force
          $hash = (Get-FileHash 'dist/WOJD-Localization-Studio-win-x64.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path 'dist/WOJD-Localization-Studio-win-x64.zip.sha256' -Value "$hash  WOJD-Localization-Studio-win-x64.zip"

          $manifest = [ordered]@{
            version = $env:VERSION
            packageUrl = "https://github.com/Skileton95/WOJD-Localization-Studio/releases/download/v$env:VERSION/WOJD-Localization-Studio-win-x64.zip"
            sha256 = $hash
          } | ConvertTo-Json -Compress
          Set-Content -Path 'dist/update.json' -Value $manifest -NoNewline

      - name: Create or update release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          $title = "WOJD Localization Studio $env:VERSION"
          $notes = "Стабильная версия WOJD Localization Studio $env:VERSION."

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag `
              'dist/WOJD-Localization-Studio-win-x64.zip' `
              'dist/WOJD-Localization-Studio-win-x64.zip.sha256' `
              'dist/update.json' `
              --clobber

            gh release edit $tag `
              --title $title `
              --notes $notes `
              --latest
          }
          else {
            gh release create $tag `
              'dist/WOJD-Localization-Studio-win-x64.zip' `
              'dist/WOJD-Localization-Studio-win-x64.zip.sha256' `
              'dist/update.json' `
              --title $title `
              --notes $notes `
              --latest
          }

      - name: Remove legacy releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $current = "v$env:VERSION"
          $oldTags = gh release list --limit 100 --json tagName --jq '.[].tagName'
          foreach ($oldTag in $oldTags) {
            if ($oldTag -and $oldTag -ne $current) {
              gh release delete $oldTag --cleanup-tag --yes
            }
          }
