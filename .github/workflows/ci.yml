name: CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build application
        shell: pwsh
        run: |
          dotnet build 'src/WOJD.LocalizationStudio/WOJD.LocalizationStudio.csproj' -c Release

      - name: Test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\TestResults" | Out-Null
          dotnet test 'tests/WOJD.LocalizationStudio.Tests/WOJD.LocalizationStudio.Tests.csproj' -c Release --results-directory "$env:GITHUB_WORKSPACE\TestResults" --logger 'trx;LogFileName=test-results.trx' 2>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE\TestResults\test-output.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: TestResults/**
          if-no-files-found: error
