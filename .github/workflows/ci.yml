name: CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build application
        shell: pwsh
        run: |
          dotnet build 'src/WOJD.LocalizationStudio/WOJD.LocalizationStudio.csproj' -c Release

      - name: Test
        shell: pwsh
        run: |
          dotnet test 'tests/WOJD.LocalizationStudio.Tests/WOJD.LocalizationStudio.Tests.csproj' -c Release --logger 'trx;LogFileName=test-results.trx'

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: tests/WOJD.LocalizationStudio.Tests/TestResults/test-results.trx
          if-no-files-found: ignore
